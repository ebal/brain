services:
  # Runs the Vite dev server directly against the bind-mounted source, with
  # hot-reload. No build step, ever — just `docker compose up` and edit files.
  brain:
    image: node:26-trixie-slim
    container_name: brain-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - npm_config_cache=/app/.npm-cache
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
